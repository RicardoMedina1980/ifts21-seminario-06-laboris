<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboris DB - MySQL Workbench Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.topbar { background: #2d2d30; border-bottom: 1px solid #3e3e42; padding: 6px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.topbar .logo { color: #007acc; font-weight: bold; font-size: 14px; }
.topbar .db-name { color: #4ec9b0; }
.topbar .back-btn { margin-left: auto; color: #9cdcfe; text-decoration: none; font-size: 12px; }
.topbar .back-btn:hover { text-decoration: underline; }
.main { display: flex; flex: 1; overflow: hidden; }

/* PANEL IZQUIERDO: LOG DE EVENTOS */
.sidebar { width: 300px; background: #252526; border-right: 1px solid #3e3e42; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { background: #2d2d30; padding: 8px 12px; border-bottom: 1px solid #3e3e42; display: flex; justify-content: space-between; align-items: center; }
.sidebar-title { color: #cccccc; font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
.btn-clear-log { background: transparent; color: #858585; border: 1px solid #3e3e42; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; }
.btn-clear-log:hover { background: #3e3e42; color: #fff; }
.event-log { flex: 1; overflow-y: auto; padding: 8px 0; }
.event-item { padding: 6px 12px; border-left: 3px solid #007acc; margin-bottom: 4px; font-size: 12px; background: #1e1e1e; }
.event-item.success { border-left-color: #4ec9b0; }
.event-item.error { border-left-color: #f44747; }
.event-item.info { border-left-color: #569cd6; }
.event-item .time { color: #858585; font-size: 10px; }
.event-item .msg { color: #d4d4d4; margin-top: 2px; font-family: 'Consolas', monospace; }
.event-empty { color: #858585; font-size: 12px; padding: 20px 12px; text-align: center; font-style: italic; }

/* PANEL CENTRAL */
.center { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.query-editor { flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid #3e3e42; min-height: 200px; }
.query-toolbar { background: #2d2d30; padding: 6px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #3e3e42; }
.btn-execute { background: #0e639c; color: white; border: none; padding: 5px 14px; border-radius: 3px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 5px; }
.btn-execute:hover { background: #1177bb; }
.btn-clear { background: transparent; color: #cccccc; border: 1px solid #3e3e42; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
.btn-clear:hover { background: #3e3e42; }
.query-label { color: #858585; font-size: 11px; margin-left: auto; }
#queryInput { flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 12px; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; resize: none; outline: none; line-height: 1.5; }
.results-panel { height: 280px; display: flex; flex-direction: column; background: #1e1e1e; }
.results-tabs { background: #2d2d30; display: flex; border-bottom: 1px solid #3e3e42; }
.tab { padding: 6px 16px; font-size: 12px; cursor: pointer; color: #969696; border-bottom: 2px solid transparent; }
.tab.active { color: #ffffff; border-bottom-color: #007acc; }
.tab:hover { color: #ffffff; }
.results-content { flex: 1; overflow: auto; padding: 8px; }
#resultsOutput { font-family: 'Consolas', monospace; font-size: 13px; white-space: pre-wrap; color: #d4d4d4; }
#resultsOutput.success { color: #4ec9b0; }
#resultsOutput.error { color: #f44747; }
#resultsOutput.info { color: #569cd6; }
.result-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.result-table th { background: #2d2d30; color: #4ec9b0; padding: 6px 10px; text-align: left; border: 1px solid #3e3e42; font-weight: bold; }
.result-table td { padding: 5px 10px; border: 1px solid #3e3e42; color: #d4d4d4; }
.result-table tr:nth-child(even) td { background: #252526; }
.statusbar { background: #007acc; color: white; padding: 3px 12px; font-size: 11px; display: flex; justify-content: space-between; }
.statusbar .status-left { display: flex; gap: 15px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #1e1e1e; }
::-webkit-scrollbar-thumb { background: #424242; border-radius: 5px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">⚡ MySQL Workbench Simulator</span>
  <span style="color:#858585;">|</span>
  <span class="db-name" id="currentDbName">Ninguna</span>
  <a href="index.html" class="back-btn">← Volver a Laboris</a>
</div>

<div class="main">
  <!-- PANEL IZQUIERDO: LOG DE EVENTOS -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">📋 Log de Eventos</span>
      <button class="btn-clear-log" onclick="clearLog()">Limpiar</button>
    </div>
    <div class="event-log" id="eventLog">
      <div class="event-empty">Esperando primera ejecución...</div>
    </div>
  </div>

  <div class="center">
    <div class="query-editor">
      <div class="query-toolbar">
        <button class="btn-execute" onclick="executeQuery()"><span class="bolt">⚡</span> Ejecutar</button>
        <button class="btn-clear" onclick="clearEditor()">🗑️ Limpiar</button>
        <span class="query-label">Query 1</span>
      </div>
      <textarea id="queryInput" spellcheck="false" placeholder="-- Escribí o pegá tu código SQL acá.&#10;-- Ejemplo:&#10;CREATE DATABASE laboris_db;&#10;USE laboris_db;&#10;CREATE TABLE ..."></textarea>
    </div>

    <div class="results-panel">
      <div class="results-tabs">
        <div class="tab active" onclick="switchTab('results', this)">📊 Resultados</div>
        <div class="tab" onclick="switchTab('history', this)">📜 Historial</div>
      </div>
      <div class="results-content" id="resultsContent">
        <div id="resultsOutput" class="info">Listo. El simulador está vacío. Ejecutá tu primer comando.</div>
      </div>
    </div>
  </div>
</div>

<div class="statusbar">
  <div class="status-left">
    <span id="statusMsg">Listo</span>
    <span id="rowCount"></span>
  </div>
  <span>MySQL Simulator v1.2 · localStorage</span>
</div>

<script>
const DB_KEY = 'laboris_db_schema';
let schema = { databases: {} };
let history = [];
let currentDb = null;
let events = [];

function loadSchema() {
  const saved = localStorage.getItem(DB_KEY);
  if (saved) {
    schema = JSON.parse(saved);
    if (Object.keys(schema.databases).length > 0) {
      currentDb = Object.keys(schema.databases)[0];
      document.getElementById('currentDbName').textContent = currentDb;
    }
  }
}
function saveSchema() { localStorage.setItem(DB_KEY, JSON.stringify(schema)); }
function getTableData(tableName) { return schema.databases[currentDb].tables[tableName].data; }
function setTableData(tableName, data) { schema.databases[currentDb].tables[tableName].data = data; saveSchema(); }
function nextId(tableName) { const data = getTableData(tableName); return data.length > 0 ? Math.max(...data.map(r => r.id)) + 1 : 1; }

function addEvent(msg, type = 'info') {
  const time = new Date().toLocaleTimeString();
  events.unshift({ time, msg, type });
  if (events.length > 100) events.pop();
  renderEvents();
}

function renderEvents() {
  const log = document.getElementById('eventLog');
  if (events.length === 0) {
    log.innerHTML = '<div class="event-empty">Esperando primera ejecución...</div>';
    return;
  }
  log.innerHTML = events.map(e => `
    <div class="event-item ${e.type}">
      <div class="time">${e.time}</div>
      <div class="msg">${e.msg}</div>
    </div>
  `).join('');
}

function clearLog() {
  events = [];
  renderEvents();
}

function executeQuery() {
  let rawQuery = document.getElementById('queryInput').value.trim();
  if (!rawQuery) { showStatus('Query vacía', 'error'); return; }

  let cleanQuery = rawQuery.replace(/--.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '');
  const statements = cleanQuery.split(';').map(s => s.trim()).filter(s => s.length > 0);
  
  let successCount = 0;
  let lastMessage = '';
  let hasError = false;
  let lastSelectResult = null;

  for (let stmt of statements) {
    const upper = stmt.toUpperCase();
    try {
      if (upper.startsWith('CREATE DATABASE')) { 
        lastMessage = handleCreateDatabase(stmt); 
        addEvent(lastMessage, 'success');
      } else if (upper.startsWith('CREATE TABLE')) { 
        lastMessage = handleCreateTable(stmt); 
        addEvent(lastMessage, 'success');
      } else if (upper.startsWith('INSERT INTO')) { 
        lastMessage = handleInsert(stmt); 
        addEvent(lastMessage, 'success');
      } else if (upper.startsWith('SELECT')) { 
        lastSelectResult = handleSelect(stmt); 
        lastMessage = `${lastSelectResult.data.length} row(s) returned from '${stmt.match(/FROM\s+(\w+)/i)[1]}'`; 
        addEvent(`SELECT: ${lastMessage}`, 'info');
      } else if (upper.startsWith('DROP TABLE')) { 
        lastMessage = handleDropTable(stmt); 
        addEvent(lastMessage, 'success');
      } else if (upper.startsWith('DROP DATABASE')) { 
        lastMessage = handleDropDatabase(stmt); 
        addEvent(lastMessage, 'success');
      } else if (upper.startsWith('USE ')) { 
        const dbName = stmt.split(/\s+/)[1];
        if (schema.databases[dbName]) { 
          currentDb = dbName; 
          document.getElementById('currentDbName').textContent = dbName; 
          lastMessage = `Database changed to '${dbName}'`; 
          addEvent(lastMessage, 'info');
        } else throw new Error(`Unknown database '${dbName}'`);
      } else {
        throw new Error('Comando no reconocido: ' + stmt.substring(0, 30) + '...');
      }
      successCount++;
    } catch (err) {
      hasError = true;
      lastMessage = err.message;
      addEvent(`ERROR: ${err.message}`, 'error');
      break;
    }
  }

  if (!hasError) {
    showStatus(`${successCount} statement(s) executed successfully`, 'success');
    addToHistory(rawQuery, 'ok', `${successCount} statement(s) executed`);
    if (lastSelectResult) {
      showResults(lastSelectResult.data, lastSelectResult.columns, `SELECT executed`);
    } else {
      document.getElementById('resultsContent').innerHTML = `<div id="resultsOutput" class="success">✅ ${lastMessage}</div>`;
    }
  } else {
    showStatus(`Error: ${lastMessage}`, 'error');
    document.getElementById('resultsContent').innerHTML = `<div id="resultsOutput" class="error">❌ Error: ${lastMessage}</div>`;
    addToHistory(rawQuery, 'error', lastMessage);
  }
}

function handleCreateDatabase(query) {
  const match = query.match(/CREATE\s+DATABASE\s+(?:IF\s+NOT\s+EXISTS\s+)?(\w+)/i);
  if (!match) throw new Error('Sintaxis incorrecta');
  const dbName = match[1];
  if (schema.databases[dbName]) return `Database '${dbName}' already exists`;
  schema.databases[dbName] = { tables: {} };
  saveSchema();
  return `Database '${dbName}' created successfully`;
}

function handleCreateTable(query) {
  if (!currentDb) throw new Error('No database selected. Use "USE dbname;" first.');
  const match = query.match(/CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?(\w+)\s*\(([\s\S]+)\)\s*;?/i);
  if (!match) throw new Error('Sintaxis incorrecta en CREATE TABLE');
  const tableName = match[1];
  const colsDef = match[2];
  if (schema.databases[currentDb].tables[tableName]) throw new Error(`Table '${tableName}' already exists`);
  
  const columns = [];
  const lines = colsDef.split(',').map(l => l.trim()).filter(l => l);
  lines.forEach(line => {
    if (line.toUpperCase().startsWith('PRIMARY KEY') || line.toUpperCase().startsWith('FOREIGN KEY') || line.toUpperCase().startsWith('UNIQUE') || line.toUpperCase().startsWith('INDEX') || line.toUpperCase().startsWith('CONSTRAINT')) return;
    const parts = line.split(/\s+/);
    const colName = parts[0];
    const colType = parts[1] ? parts[1].toUpperCase() : 'VARCHAR(255)';
    const rest = line.toUpperCase();
    columns.push({ name: colName, type: colType, primaryKey: rest.includes('PRIMARY KEY'), notNull: rest.includes('NOT NULL'), autoIncrement: rest.includes('AUTO_INCREMENT'), unique: rest.includes('UNIQUE'), default: rest.includes('CURRENT_TIMESTAMP') ? 'CURRENT_TIMESTAMP' : null });
  });
  schema.databases[currentDb].tables[tableName] = { columns, data: [] };
  saveSchema();
  return `Table '${tableName}' created with ${columns.length} columns`;
}

function handleInsert(query) {
  if (!currentDb) throw new Error('No database selected.');
  const match = query.match(/INSERT\s+INTO\s+(\w+)\s*\(([^)]+)\)\s*VALUES\s*\(([^)]+)\)\s*;?/i);
  if (!match) throw new Error('Sintaxis incorrecta en INSERT');
  const tableName = match[1];
  const cols = match[2].split(',').map(c => c.trim());
  const vals = match[3].split(',').map(v => v.trim().replace(/^['"]|['"]$/g, ''));
  if (!schema.databases[currentDb].tables[tableName]) throw new Error(`Table '${tableName}' doesn't exist`);
  
  const table = schema.databases[currentDb].tables[tableName];
  const row = {};
  cols.forEach((col, i) => { row[col] = vals[i] === 'NULL' ? null : vals[i]; });
  
  const idCol = table.columns.find(c => c.autoIncrement);
  if (idCol && !row[idCol.name]) row[idCol.name] = nextId(tableName);
  
  table.columns.forEach(col => { if (col.default === 'CURRENT_TIMESTAMP' && !row[col.name]) row[col.name] = new Date().toISOString().replace('T', ' ').substring(0, 19); });
  table.columns.forEach(col => { if (col.notNull && (row[col.name] === undefined || row[col.name] === null || row[col.name] === '')) throw new Error(`Column '${col.name}' cannot be null`); });
  table.columns.forEach(col => { if (col.unique && row[col.name]) { const exists = table.data.find(r => r[col.name] === row[col.name]); if (exists) throw new Error(`Duplicate entry '${row[col.name]}' for key '${col.name}'`); } });
  
  const data = getTableData(tableName);
  data.push(row);
  setTableData(tableName, data);
  return `1 row inserted into '${tableName}' (id: ${row.id || 'auto'})`;
}

function handleSelect(query) {
  if (!currentDb) throw new Error('No database selected.');
  const match = query.match(/SELECT\s+(.+?)\s+FROM\s+(\w+)(?:\s+WHERE\s+(.+?))?\s*;?$/i);
  if (!match) throw new Error('Sintaxis incorrecta en SELECT');
  const colsStr = match[1].trim();
  const tableName = match[2];
  const whereClause = match[3];
  if (!schema.databases[currentDb].tables[tableName]) throw new Error(`Table '${tableName}' doesn't exist`);
  
  const table = schema.databases[currentDb].tables[tableName];
  let data = [...table.data];
  if (whereClause) {
    const whereMatch = whereClause.match(/(\w+)\s*=\s*['"]?([^'"]+)['"]?/i);
    if (whereMatch) { const col = whereMatch[1]; const val = whereMatch[2]; data = data.filter(r => String(r[col]) === val); }
  }
  
  let columns;
  if (colsStr === '*') { columns = table.columns; }
  else {
    const colNames = colsStr.split(',').map(c => c.trim());
    columns = colNames.map(name => table.columns.find(c => c.name === name) || { name, type: 'VARCHAR' });
    data = data.map(row => { const newRow = {}; colNames.forEach(name => { newRow[name] = row[name] !== undefined ? row[name] : 'NULL'; }); return newRow; });
  }
  return { data, columns };
}

function handleDropTable(query) {
  if (!currentDb) throw new Error('No database selected.');
  const match = query.match(/DROP\s+TABLE\s+(?:IF\s+EXISTS\s+)?(\w+)\s*;?/i);
  if (!match) throw new Error('Sintaxis incorrecta');
  const tableName = match[1];
  if (!schema.databases[currentDb].tables[tableName]) throw new Error(`Table '${tableName}' doesn't exist`);
  delete schema.databases[currentDb].tables[tableName];
  saveSchema();
  return `Table '${tableName}' dropped`;
}

function handleDropDatabase(query) {
  const match = query.match(/DROP\s+DATABASE\s+(?:IF\s+EXISTS\s+)?(\w+)\s*;?/i);
  if (!match) throw new Error('Sintaxis incorrecta');
  const dbName = match[1];
  if (!schema.databases[dbName]) throw new Error(`Database '${dbName}' doesn't exist`);
  delete schema.databases[dbName];
  if (currentDb === dbName) { currentDb = null; document.getElementById('currentDbName').textContent = 'Ninguna'; }
  saveSchema();
  return `Database '${dbName}' dropped`;
}

function showResults(data, columns, message) {
  const content = document.getElementById('resultsContent');
  if (!data || data.length === 0) { content.innerHTML = `<div id="resultsOutput" class="info">${message || '0 rows returned'}</div>`; return; }
  let html = `<div style="color:#4ec9b0;margin-bottom:8px;font-size:12px;">${message}</div>`;
  html += '<table class="result-table"><thead><tr>';
  columns.forEach(col => { html += `<th>${col.name} <span style="color:#569cd6;font-size:10px;">${col.type || ''}</span></th>`; });
  html += '</tr></thead><tbody>';
  data.forEach(row => { html += '<tr>'; columns.forEach(col => { const val = row[col.name] !== undefined && row[col.name] !== null ? row[col.name] : 'NULL'; html += `<td>${val}</td>`; }); html += '</tr>'; });
  html += '</tbody></table>';
  content.innerHTML = html;
  document.getElementById('rowCount').textContent = `${data.length} row(s)`;
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.style.color = type === 'error' ? '#f44747' : type === 'success' ? '#4ec9b0' : '#d4d4d4';
}

function addToHistory(query, status, message) {
  history.unshift({ query, status, message, time: new Date().toLocaleTimeString() });
  if (history.length > 50) history.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('resultsContent');
  if (history.length === 0) { list.innerHTML = '<div class="event-empty">Sin queries ejecutadas</div>'; return; }
  list.innerHTML = history.map((h, i) => `<div class="event-item ${h.status === 'ok' ? 'success' : 'error'}" onclick="document.getElementById('queryInput').value=history[${i}].query" style="cursor:pointer;border-bottom:1px solid #3e3e42;"><div class="time">${h.time} · <span style="color:${h.status === 'ok' ? '#4ec9b0' : '#f44747'}">${h.status === 'ok' ? '✓ OK' : '✗ Error'}</span></div><div class="msg">${h.query}</div><div style="color:#858585;font-size:10px;margin-top:2px;">${h.message}</div></div>`).join('');
}

function clearEditor() { document.getElementById('queryInput').value = ''; document.getElementById('queryInput').focus(); }

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const content = document.getElementById('resultsContent');
  if (tab === 'history') {
    renderHistory();
  } else {
    content.innerHTML = '<div id="resultsOutput" class="info">Ejecutá un SELECT para ver resultados acá.</div>';
  }
}

document.addEventListener('DOMContentLoaded', () => { loadSchema(); });
document.getElementById('queryInput').addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); executeQuery(); } });
</script>
</body>
</html>
